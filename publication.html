    <!-- Filtres -->
    <section class="max-w-6xl mx-auto px-4 py-8" id="filters">
      <h2 class="text-xl font-semibold text-blue-900 mb-4">Filtrer les Publications</h2>

      <div class="grid grid-cols-1 md:grid-cols-4 gap-4 mb-6">

          <select id="year" class="w-full border border-gray-300 rounded-md px-3 py-2">

        <div>

          <select id="subject" class="w-full border border-gray-300 rounded-md px-3 py-2">

        <div>
          <label class="block text-sm font-medium mb-1" for="type"><i class="fa-solid fa-file-alt mr-1"></i>Type</label>
          <select id="type" class="w-full border border-gray-300 rounded-md px-3 py-2">

        <div>

      <div class="flex items-center space-x-4">

    </section>

    <!-- Script -->
    <script>
          $('header img').next().text(localStorage.getItem("user_nom")) 
    $.ajax({
    url: 'get_photo.php', // le paramètre id sera dans l'URL
    data: { id:localStorage.getItem("user_id") },
    method: 'GET',
    dataType: 'json',
    success: function(response) {
        if (response.avatar) {
            $('header img').attr('src', response.avatar);
            console.log("Avatar chargé !");
        } else {
            $('img').attr('alt', 'Aucune image trouvée');
        }
    },
    error: function(xhr, status, error) {
        console.error('Erreur AJAX :', error);
    }
});
       $("header button").on("click",()=>{
                localStorage.clear()
                window.location.href = `signin.html`;
        })
                 if (!localStorage.getItem("user_id")) {
                window.location.href = `signin.html`;
}
      const publications = [];
      let sortDesc = true;

      $(document).ready(function () {
        function populateFilters(publication) {
          const types = new Set(), subjects = new Set(), years = new Set();

          publication.forEach(pub => {
            types.add(pub.type);
            subjects.add(pub.subject);
            years.add(pub.year);
          });

          types.forEach(type => $("#type").append(`<option value="${type}">${type}</option>`));
          subjects.forEach(sub => $("#subject").append(`<option value="${sub}">${sub}</option>`));
          years.forEach(year => $("#year").append(`<option value="${year}">${year}</option>`));
        }

        function displayPublications(list) {
          const container = $("#publicationList");
          container.empty();

          if (list.length === 0) {
            
            container.append('<p class="italic text-gray-500">Aucune publication trouvée.</p>');
            return;
          }

          container.append(`<p class="text-sm text-gray-600">${list.length} publication(s) trouvée(s).</p>`);

          list.forEach(pub => {
            const card = `
              <div class="bg-white rounded-md shadow-sm p-6 border border-gray-100">
                <h3 class="text-lg font-semibold text-blue-900 mb-1">${pub.title}</h3>
                <p class="text-sm text-gray-700 mb-1"><strong>Auteurs :</strong> ${pub.author}</p>
                <p class="text-sm text-gray-700 mb-1">
                  <strong>Année :</strong> ${pub.year} |
                  <strong>Type :</strong> ${pub.type}
                </p>
                <p class="text-sm text-gray-700">
                  <strong>Sujet :</strong> 
                  <span class="inline-block bg-blue-100 text-blue-800 text-xs font-semibold px-2 py-1 rounded">${pub.subject}</span>
                </p>
              </div>`;
            container.append(card);
          });
        }

        function applyFilters() {
          const year = $("#year").val();
          const subject = $("#subject").val().toLowerCase();
          const type = $("#type").val().toLowerCase();
          const keyword = $("#search").val().toLowerCase().trim();

          let filtered = publications.filter(pub => {
            const matchYear = year ? pub.year.toString() === year : true;
            const matchSubject = subject ? pub.subject.toLowerCase().includes(subject) : true;
            const matchType = type ? pub.type.toLowerCase() === type : true;
            const matchKeyword = keyword ?
              pub.title.toLowerCase().includes(keyword) || pub.author.toLowerCase().includes(keyword) : true;

            return matchYear && matchSubject && matchType && matchKeyword;
          });

          if (!sortDesc) {
            filtered.sort((a, b) => a.year - b.year);
          } else {
            filtered.sort((a, b) => b.year - a.year);
          }

          displayPublications(filtered);
        }

        // Chargement initial des données
        $.ajax({
          type: 'POST',
          url: 'pub.php',
          dataType: 'json',
          success: function (response) {
            $("#loading").remove();
            response.forEach(pub => publications.push(pub));
            populateFilters(publications);
            applyFilters();
          },
          error: function () {
            $("#loading").text("Erreur lors du chargement des publications.");
          }
        });

        $("#applyFilters, #search").on("input click", applyFilters);
        $("#resetFilters").on("click", function () {
          $("#year, #subject, #type, #search").val("");
          applyFilters();
        });

        $("#sortYear").on("click", function () {
          sortDesc = !sortDesc;
          $(this).text(sortDesc ? "⇅ Trier par année décroissante" : "⇅ Trier par année croissante");
          applyFilters();
        });
      });
      
    </script>
    
  </body>
